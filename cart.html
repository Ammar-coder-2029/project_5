<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png/svg" href="imges/pagelines-brands-solid-full.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/all.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>cart</title>
</head>
<body>
    <header class="flex-col md:flex-row py-3 gap-4">
        <div class="logo-head"><a href="index.html"><img src="imges/plant-logo.png" alt="logo"></a></div>
        <div class="head-parent">
            <ul class="links">
                <li class="login"><a href="login.html">login</a></li>
                <li class="register"><a href="register.html">register</a></li>
            </ul>
            <ul class="user-info">
                <li class="user"><a href="">Hello, </a></li>
                <li class="cart flex">
                        <a href="cart.html">
                            <i class="fa-solid fa-cart-shopping"></i>
                            <span id="counter">0</span>
                        </a>
                </li>
                <li class="logout" id="logout"><a href="">logout</a></li>
            </ul>
        </div>
    </header>
    <main class="m-cart ">
        <section class="productsCart border-b-2">
            <div class="productCart h-fit md:h-[250px]">
                <div class="img-container imgConCart">
                    <img src="imges/redMBW.jpg" alt="img of product">
                </div>
                <div class="disc-prod">
                    <h1>h22222</h1>
                    <h4 class="catigory">catigory:caaaaaa</h4>
                    <h4 class="price">price:1000</h4>
                    <div class="action">
                        <span class="" id="counter"></span>
                        <button type="submit" class="" id="remove-from-cart">remove to cart</button>
                    </div>
                </div>
            </div>
            <div class="totalprice">
                <h2>total price: $</h2>
            </div>
        </section>
        <section class="favourt">
            <div class="fav-header">
                <h1 class=""></h1>
                <div class="line"></div>
            </div>
            <section class="products">
            <div class="product h-fit md:h-[250px]">
                <div class="img-container">
                    <img src="imges/redMBW.jpg" alt="img of product">
                </div>
                <div class="disc-prod">
                    <h1>h22222</h1>
                    <h4 class="catigory" id="catigory">catigory:caaaaaa</h4>
                    <div class="action">
                        <span class="cursor-pointer" id="remove-from-fav"><i class="fa-solid fa-heart"></i></span>
                    </div>
                </div>
            </div>
        </section>
        </section>
    </main>
    <script src="js/cart.js"></script>
</body>
</html>
