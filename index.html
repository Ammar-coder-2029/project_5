<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/all.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Home</title>
</head>
<body>
    <header>
        <div class="logo-head"><a href="index.html"><img src="imges/meformal.jpg" alt="logo"></a></div>
        <div class="head-parent">
            <ul class="links">
                <li class="login"><a href="login.html">login</a></li>
                <li class="register"><a href="register.html">register</a></li>
            </ul>
            <ul class="user-info">
                <li class="user"><a href=""></a></li>
                <li class="cart">
                        <a href="cart.html">
                            <i class="fa-solid fa-cart-shopping"></i><span id="count-prod">0</span>
                        </a>
                </li>
                <li id="logout"><a href="">logout</a></li>
            </ul>
        </div>
    </header>
    <main class="">
        <section class="search">
            <select id="selector" title="type of search">
                <option value="">search by title</option>
                <option value="">search by catigory</option>
            </select>
            <input type="text" name="text" id="search-input" placeholder="Search...">
            <button type="submit">search</button>
        </section>
        <section class="products">
            <div class="product h-fit md:h-[250px]">
                <div class="img-container">
                    <img src="imges/redMBW.jpg" alt="img of product">
                </div>
                <div class="disc-prod">
                    <h1>h22222</h1>
                    <h4>price:1000</h4>
                    <h4 class="catigory" id="catigory">catigory:caaaaaa</h4>
                    <div class="action">
                        <i class="fa-solid fa-heart"></i>
                        <button type="submit" class="" id="add-to-cart">add to cart</button>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
